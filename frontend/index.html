<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gym Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        ul { list-style-type: none; padding: 0; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bitácora de Entrenamientos</h2>
        <button onclick="cargarEntrenamientos()">Cargar Rutinas</button>
        <ul id="lista-entrenamientos"></ul>
    </div>

    <script>
        // Usaremos una ruta relativa para que funcione bien con Docker más adelante
        const API_URL = `http://${window.location.hostname}:3000/api/entrenamientos`;

        async function cargarEntrenamientos() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const lista = document.getElementById('lista-entrenamientos');
                lista.innerHTML = '';
                data.forEach(entrenamiento => {
                    const li = document.createElement('li');
                    li.textContent = `[${entrenamiento.rutina}] ${entrenamiento.ejercicio} - ${entrenamiento.series}x${entrenamiento.repeticiones}`;
                    lista.appendChild(li);
                });
            } catch (error) {
                console.error('Error al cargar la data:', error);
            }
        }
    </script>
</body>
</html>
